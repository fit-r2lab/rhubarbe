# /etc/rhubarbe/rhubarbe.conf
# .ini format
# can be overridden - on individual values basis - no need to copy it all
# in either
# /etc/rhubarbe/rhubarbe.conf.local (mostly for passwords and the like)
# ~/.rhubarbe.conf
# ./rhubarbe.conf
#
# Also a given variable foo can have different values depending on the hostname
# foo = the-general-value
# foo.myhostname = the-specific-value-for-myhostname
# see the bandwidth example below


[r2labapi]
# the REST replacement for PLCAPI
url = https://r2labapi.inria.fr:443/
# the resource name used for leases (replaces plcapi.leases_hostname)
resource_name = r2lab.inria.fr
# set admin_token in rhubarbe.conf.local
# [r2labapi]
# admin_token = to-be-redefined


[testbed]
# the prefix that hostnames are based on
regularname = fit

# same for the CMC interfaces
rebootname = reboot

# where to find the inventory json file
inventory_nodes_path = /etc/rhubarbe/inventory-nodes.yaml
inventory_phones_path = /etc/rhubarbe/inventory-phones.yaml
# this one is in yaml; some day we could do the same on the other inventories....
inventory_pdus_path = /etc/rhubarbe/inventory-pdus.yaml
# yaml as well
inventory_relays_path = /etc/rhubarbe/inventory-relays.yaml
# the folder where to store the relays databases (temperatures in csv format)
relays_database_folder = /etc/rhubarbe/relays

# what should the -a option do based on hostname
all_scope = 1-37

# other deployments (e.g. preplab) can override this
# in /etc/rhubarbe/rhubarbe.conf.local
#all_scope=38-42


[nodes]
# after a reset, how long should we wait
idle_after_reset = 15

# how long to wait for telnet after a reset in stage1
timeout_before_telnet = 80

### default timeouts
# for 'status', 'on', 'off', 'info'
cmc_default_timeout = 3
# for 'bye'
cmc_safe_timeout = 60
# for 'wait'
wait_default_timeout = 60
# need to account for possible laaarge images
load_default_timeout = 300
save_default_timeout = 300
# for 'docker load' (frisbee load + pull + run) and 'docker save'
docker_default_timeout = 300

# not used in rhubarbe per se, but exposed to nightly
load_nightly_timeout = 150
wait_nightly_timeout = 40
ssh_nightly_timeout = 5

# preplab may be slower
# load_default_timeout.distrait = 900
# save_default_timeout.distrait = 900

[docker]
# 'rhubarbe docker' : docker-enabled nodes run a frisbee 'host image'
# (docker, or podman on fedora - the remote command is always 'docker')
# and a user container named 'container' that owns ssh port 22
host_image = docker
# the host's own sshd listens here, as the container uses port 22
host_ssh_port = 2222
# container image to run when -i is not given on the command line
# (if unset, -i is mandatory)
# default_container_image = some-image

# the private registry that 'docker save' pushes to; images given to
# 'docker save -o' without a registry part are prefixed with this one
# (dockerhub.pl.sophia.inria.fr is an older name for it, to be phased out)
registry = registry.pl.sophia.inria.fr

# credentials for writes that the registry does not accept from the testbed
# on trust (rmi and save outside the allowlist). Both keys must be set.
# NEVER put the real values here nor in rhubarbe.conf.local, which every
# experimenter can read: use root's ~/.rhubarbe.conf (mode 600)
# registry_user = admin
# registry_password = ...

# our namespace in that registry: 'docker save -o foo' pushes
# registry/prefix/foo, 'docker images' shows only this namespace by default,
# and 'docker rmi' only deals with it. The registry only accepts pushes
# from the testbed under this prefix, see DOCKER.md
prefix = r2lab

# optional pull-through cache of Docker Hub; at load time, the nodes' engine
# is configured to use it (docker: daemon.json, podman: registries.conf.d),
# so that host images need not know about it. An http:// mirror is
# automatically declared insecure
mirror = http://registry.theblueprintfactory.org

# Images need not contain an sshd: if this is set, a static dropbear is
# uploaded to the node and started in the container, unless something
# already listens on port 22 after sshd_grace seconds (images with their own
# sshd). See r2lab-imaging/docker/dropbear to build it
dropbear = /root/r2lab-imaging/docker/dropbear/dropbear

# the injected sshd lets root in with an empty password: like for nodes,
# there is no access control, as it is done upstream by the gateway
sshd_grace = 5

# optional : passed as --dns to 'docker run'
# dns = 138.96.0.10

[pdus]
# how long to wait for a pdu command to complete
ssh_timeout = 20


[phones]
# how long to wait for a phone-off ssh command to complete
ssh_timeout = 20


[pxelinux]
# where does pxelinux look for host-based symlinks
config_dir = /tftpboot/pxelinux.cfg/

# the name of the image that has telnet + frisbee
# see r2lab-misc/tftpboot for the available variants
# a file with that name must exist in config_dir, or load / rescue will fail
# use k44 by default; this is a tradeoff: a reasonable size, and reasonably not-too-old
# k70 is built on 7.0 which is more recent, but substantially heavier
# see r2lab-misc/tftpboot/README-AHCI-2026.md for more details
frisbee_image = pxefrisbee-k44
# can be overridden for a given node, using its control hostname as a suffix
# frisbee_image.fit03 = pxefrisbee-k70


[frisbee]
# should not be necessary to mention their path here
images_dir = /var/lib/rhubarbe-images
default_image = default.ndz
# where 'share' stores images, relative to images_dir; empty means toplevel
# images_dir is scanned recursively, but only its toplevel is meant to be
# synced between hosts; so a host that is the target of a sync, like the
# preplab, should store its own images in a subfolder
share_subdir.distrait = prep
share_subdir =

# loading images
server = frisbeed
server_options = -K 3
client = frisbee

# saving images
imagezip = imagezip

# qualify with /bin - just a convenience at devel time for pgrep
#netcat = /bin/nc
netcat = nc

# choose between 'fedora' (run nc < /dev/null) or 'ubuntu' (run nc -d)
netcat_style = fedora

# this might need to be configurable on the command line ?
hard_drive = /dev/sda

# the partition where to expect /etc for storing /etc/rhubarbe-image
# set to none to disable the feature
root_partition = /dev/sda1

# mount point to mount /etc when creating /etc/rhubarbe-image
mount_point = /mnt


[networking]
telnet_port = 23

# how much time to wait between 2 attempts to telnet
telnet_backoff = 3
ssh_backoff = 3

# how long to wait before giving up
# remember everything is local
# 2021 May 31
# however, nodes are sometimes loaded or a bit ill-configured
# and take time to answer monitor when it asks for versions and so on
# and today I've seen a distrinet node that really needed this 2s delay
ssh_timeout = 2
ping_timeout = 0.5

# how long to wait for the connection to get created
# NOT the session itself of course
telnet_timeout = 0.5
# see telnetlib3.open_connection;
telnet_connect_minwait = 0.2
telnet_connect_maxwait = 1

# ranges to use for the multicast traffic
# 2 separate sessions need
# 2 different IP addresses so that IGMP can ensure the traffic
# is correctly isolated from one another
# and 2 different port numbers because otherwise the second frisbeed
# cannot bind its port
pattern_multicast = 234.5.6.*
pattern_port = 10000 + *

# will replace '*' with values from 1 to this limit
pattern_size = 20

# in Mibps (multiplied by 2**20)
# as of 2023 this should be fine
bandwidth = 500

### for any of the config variables you can also define a value
# for a specific hostname. This feature is designed to maintain a single
# config file for several hosts
# for exemple for the r2lab gateway that is known as faraday.inria.fr
# bandwidth.faraday = 500

# but its attached preplab (distrait.pl.sophia.inria.fr) could use another value
# bandwidth.distrait = 300


[monitor]
# how often to do this (sleep between 2 probes of the same node)
# it's not called a period so each node lives its own life
# plus, it takes some non-negligible time to actually probe a node
cycle_nodes = 2

# cycle for the monitorphones loop
cycle_phones = 2

# cycle for the monitorpdus loop
cycle_pdus = 1

# cycle for acquiring leases
cycle_leases = 60

# internal cycle; this is an async. wait, essentially to check for fast_track
# i.e. 'request' messages sent by a web UI - typically when a lease is being set
step_leases = 0.05

# this truly is periodic; every period we log an entry in /var/log/monitor.log
log_period = 4

# ports for Prometheus /metrics endpoints (set to 0 to disable)
prometheus_port_nodes = 9101
prometheus_port_phones = 9102
prometheus_port_pdus = 9103


[sidecar]
# where to report the data (a socketIO server)
# no longer the default, set in local config
# url = wss://r2lab-sidecar.inria.fr:443/


[accounts]
# three options for the access policy:
# (*) open: all known and valid slices remain ssh-reachable at all times
# (*) leased: only the lease that currently has a valid lease can ssh-enter
# (*) closed: no slice can enter the testdbed at any time
access_policy = leased

# how often should we probe the API to refresh accounts and authorized_keys
# as of dec. 2016 it takes .1 s, so every minute seems about right
cycle = 60

# a comma-separated list of account names that don't need a lease
# it is safer to not mention here a login that has an '_' in it
# especially with the 'closed' access policy
privileged = root,guest
